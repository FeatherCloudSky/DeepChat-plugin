<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DeepChat">
  <title>DeepChat</title>
  <defs>
    <linearGradient id="deepchat" gradientUnits="userSpaceOnUse" x1="64" y1="48" x2="448" y2="470">
      <stop offset="0" stop-color="#6FB2FF"/>
      <stop offset="1" stop-color="#3F5EE8"/>
    </linearGradient>
  </defs>

  <!-- 气泡本体 + 猫耳 + 尾巴，同一个渐变，一眼是「聊天」 -->
