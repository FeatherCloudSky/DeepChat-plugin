    <path d="M148 48 L112 124 L208 124 Z"/>
    <path d="M364 48 L304 124 L400 124 Z"/>
    <rect x="64" y="112" width="384" height="272" rx="88"/>
    <path d="M152 366 L104 458 L248 380 Z"/>
  </g>

  <!-- 三个打字点 -->
  <g fill="#FFFFFF">
    <circle cx="176" cy="248" r="26"/>
    <circle cx="256" cy="248" r="26"/>
    <circle cx="336" cy="248" r="26"/>
  </g>
